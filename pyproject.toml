[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rojnik"
version = "0.1.0"
description = "A minimal, from-scratch async agentic harness with multi-agent support"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josip Delic", email = "delijati@gmail.com" }]
keywords = ["agent", "llm", "openai", "agentic", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]

dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "loguru>=0.7",
    "tiktoken>=0.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "textual>=8.0",
]
# Install every supported provider's SDK alongside the core package.
# Only install what you actually use.
deepseek  = []          # DeepSeek uses the openai SDK — no extra install needed
local     = []          # OpenAI-compatible local servers need no extra SDK
mcp       = ["mcp>=2.2,<3"]

[project.urls]
Repository = "https://github.com/delijati/rojnik"
Issues     = "https://github.com/delijati/rojnik/issues"

# ---------------------------------------------------------------------------
# Setuptools — src layout
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
pythonpath  = ["src"]

# ---------------------------------------------------------------------------
# Ruff (linter / formatter) — optional, install with `pip install ruff`
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["rojnik"]

# ---------------------------------------------------------------------------
# Mypy (static type checker) — optional, install with `pip install mypy`
# ---------------------------------------------------------------------------

[tool.mypy]
python_version    = "3.11"
strict            = false
ignore_missing_imports = true
